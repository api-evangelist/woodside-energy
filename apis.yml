name: Woodside Energy

description: Woodside Energy is a global energy company founded in Australia in 1954 and headquartered in Perth, Western Australia. It established Australia's liquefied natural gas (LNG) industry and operates an LNG-led portfolio of oil and gas assets and interests in Australia, the Americas, the Caribbean, Senegal and Timor-Leste, expanded by its 2022 merger with BHP's petroleum business, alongside new energy projects in hydrogen, ammonia and lower-carbon services. Its public web presence (woodside.com) covers operations, investors, media, suppliers and careers; no public developer API, developer portal or API documentation was found. portal.woodside.com is a credentialed reporting portal (WoodsideUS Reports), not a developer surface.

